<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f131d" />
    <title>Roland E-X50 Tone Finder</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                        },
                        dark: {
                            950: '#080a10',
                            900: '#0f131d',
                            850: '#151b28',
                            800: '#1b2234',
                            700: '#263048',
                            600: '#374360'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0f131d;
        }

        ::-webkit-scrollbar-thumb {
            background: #263048;
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #374360;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .tap-highlight-transparent {
            -webkit-tap-highlight-color: transparent;
        }

        /* Category scroll indicators */
        .category-scroll-container {
            mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
        }

        @media (min-width: 1024px) {
            .category-scroll-container {
                mask-image: none;
                -webkit-mask-image: none;
            }
        }
    </style>
</head>

<body
    class="bg-dark-900 text-slate-100 font-sans min-h-screen antialiased selection:bg-brand-500 selection:text-white pb-24">

    <!-- Main Container: Fully Responsive (Mobile, Tablet, Desktop) -->
    <div class="w-full max-w-7xl mx-auto min-h-screen flex flex-col relative px-3 sm:px-6 lg:px-8 pt-2 sm:pt-4 pb-12">

        <!-- Top Sticky Header -->
        <header
            class="sticky top-0 z-30 pt-2 pb-3 bg-dark-900/95 backdrop-blur-md -mx-3 sm:-mx-6 lg:-mx-8 px-3 sm:px-6 lg:px-8 border-b border-dark-700 shadow-md shadow-black/40">

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-3">
                <!-- Brand & Logo -->
                <div class="flex items-center justify-between md:justify-start gap-3">
                    <div class="flex items-center gap-3">
                        <!-- Roland Official Logo -->
                        <div
                            class="h-10 px-2.5 rounded-xl bg-white border border-dark-700 flex items-center justify-center shadow-sm">
                            <img src="logo.png" alt="Roland Logo" class="h-8 w-8 object-contain" loading="eager" />
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5">
                                <span class="text-xs font-semibold text-slate-400">Roland</span>
                                <span
                                    class="hidden sm:inline-block px-1.5 py-0.2 rounded bg-orange-500/20 border border-orange-500/30 text-[10px] font-bold text-orange-400 font-mono">ARRANGER</span>
                            </div>
                            <h1 class="text-base sm:text-lg font-extrabold text-white tracking-tight leading-tight">
                                E-X50 Tone Finder</h1>
                        </div>
                    </div>

                    <!-- Mobile Action Buttons (Favorites & Total Count Badge) -->
                    <div class="flex items-center gap-1.5 md:hidden">
                        <button id="favoriteFilterBtn" onclick="toggleFavoritesOnly()"
                            class="tap-highlight-transparent p-2 rounded-xl bg-dark-800 border border-dark-700 hover:border-amber-400/50 text-slate-300 hover:text-amber-400 transition-all flex items-center gap-1.5 text-xs font-medium"
                            title="View Favorites">
                            <i data-lucide="star" id="favFilterIcon" class="w-4 h-4"></i>
                            <span id="favCount" class="text-[11px] font-bold hidden">0</span>
                        </button>

                        <div class="px-2.5 py-1.5 rounded-xl bg-dark-800 border border-dark-700 text-right">
                            <div class="text-[10px] uppercase text-slate-400 font-medium leading-none">Total</div>
                            <div id="totalBadge" class="text-xs font-bold text-orange-400 font-mono leading-tight">707
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Desktop Search & Action Bar -->
                <div class="flex-1 max-w-xl md:mx-4">
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </div>
                        <input type="text" id="searchInput"
                            placeholder="Search tone number (e.g. 144), name, or LCD..."
                            class="w-full pl-10 pr-16 sm:pr-20 py-2.5 rounded-xl bg-dark-800 border border-dark-700 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-sm text-slate-100 placeholder-slate-400 transition-all outline-none"
                            autocomplete="off" autocorrect="off" spellcheck="false" />
                        <div class="absolute inset-y-0 right-0 flex items-center pr-2.5 gap-1">
                            <button id="clearSearchBtn" onclick="clearSearch()"
                                class="p-1 text-slate-400 hover:text-slate-200 hidden tap-highlight-transparent"
                                title="Clear search">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                            <span
                                class="hidden sm:inline-block px-1.5 py-0.5 rounded text-[10px] font-mono text-slate-500 bg-dark-900 border border-dark-700"
                                title="Keyboard shortcut">/</span>
                        </div>
                    </div>
                </div>

                <!-- Desktop Action Buttons -->
                <div class="hidden md:flex items-center gap-2">
                    <button id="favoriteFilterBtnDesktop" onclick="toggleFavoritesOnly()"
                        class="tap-highlight-transparent px-3 py-2 rounded-xl bg-dark-800 border border-dark-700 hover:border-amber-400/50 text-slate-300 hover:text-amber-400 transition-all flex items-center gap-2 text-xs font-semibold"
                        title="View Favorites">
                        <i data-lucide="star" id="favFilterIconDesktop" class="w-4 h-4"></i>
                        <span>Favorites</span>
                        <span id="favCountDesktop"
                            class="px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-bold hidden">0</span>
                    </button>

                    <div class="px-3 py-1.5 rounded-xl bg-dark-800 border border-dark-700 text-right">
                        <div class="text-[10px] uppercase text-slate-400 font-medium leading-none">Total Tones</div>
                        <div class="text-xs font-bold text-orange-400 font-mono leading-tight">707</div>
                    </div>
                </div>
            </div>

            <!-- Category Filter Pills (Horizontal Scroll on Mobile, Smooth Flex on Large Screens) -->
            <div
                class="category-scroll-container overflow-x-auto hide-scrollbar -mx-3 sm:-mx-6 lg:-mx-8 px-3 sm:px-6 lg:px-8 pb-0.5">
                <div class="flex gap-1.5 w-max md:w-auto md:flex-wrap items-center" id="categoryTabs">
                    <!-- Generated by JS -->
                </div>
            </div>
        </header>

        <!-- Quick Status Bar -->
        <div class="flex items-center justify-between text-xs text-slate-400 pt-3.5 pb-2.5 px-1">
            <div id="resultsCount">Showing <span class="font-bold text-slate-200">707</span> tones</div>
            <div class="flex items-center gap-3">
                <span class="hidden sm:inline-block text-[11px] text-slate-500 font-mono">Click any card to copy tone details</span>
            </div>
        </div>

        <!-- Tone List Container (Responsive Grid: 1 col Mobile, 2 cols Tablet, 3 cols Desktop, 4 cols Wide) -->
        <main id="toneList"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2.5 sm:gap-3 flex-1">
            <!-- Generated list items -->
        </main>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center px-4 w-full">
            <div
                class="w-16 h-16 rounded-2xl bg-dark-850 border border-dark-700 flex items-center justify-center text-slate-400 mb-3 shadow-lg">
                <i data-lucide="search-x" class="w-8 h-8 text-orange-400"></i>
            </div>
            <h3 class="text-base font-bold text-slate-100 mb-1">No Tones Found</h3>
            <p class="text-xs text-slate-400 max-w-sm">Try searching with another number (1 - 707), LCD abbreviation, or switch category filter.</p>
            <button onclick="resetFilters()"
                class="mt-4 px-4 py-2.5 rounded-xl bg-dark-800 border border-dark-700 hover:border-brand-500 text-xs font-semibold text-orange-400 transition shadow-sm">
                Reset Search
            </button>
        </div>

        <!-- Quick Number Dial Modal / Floating Action Button -->
        <div class="fixed bottom-5 right-5 sm:bottom-6 sm:right-6 z-40">
            <button onclick="openKeypadModal()"
                class="tap-highlight-transparent flex items-center gap-2 px-4 py-2.5 sm:py-3 rounded-full bg-gradient-to-r from-orange-500 to-amber-500 text-dark-950 font-bold text-xs sm:text-sm shadow-xl shadow-black/50 hover:scale-105 active:scale-95 transition-all">
                <i data-lucide="calculator" class="w-4 h-4 stroke-[2.5]"></i>
                <span>Quick Dial</span>
                <span class="hidden lg:inline-block px-1.5 py-0.2 rounded bg-black/20 text-[10px] font-mono">K</span>
            </button>
        </div>

        <!-- Keypad Modal Dialog (Responsive Bottom Sheet on Mobile, Centered Modal on Tablet/Desktop) -->
        <div id="keypadModal"
            class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
            <div
                class="w-full sm:max-w-xs bg-dark-850 border border-dark-700 rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl transition-transform max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between pb-3 border-b border-dark-700 mb-4">
                    <div class="flex items-center gap-2">
                        <i data-lucide="calculator" class="w-4 h-4 text-orange-400"></i>
                        <h3 class="text-sm font-bold text-slate-100">Tone Number Keypad</h3>
                    </div>
                    <button onclick="closeKeypadModal()" class="p-1 rounded-lg text-slate-400 hover:text-white"
                        title="Close">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Number Display -->
                <div class="bg-dark-900 rounded-xl p-3 text-center border border-dark-700 mb-4 shadow-inner">
                    <div class="text-[10px] uppercase font-mono tracking-wider text-slate-400">Tone Number (1 - 707)
                    </div>
                    <div id="keypadDisplay"
                        class="text-3xl font-mono font-black text-orange-400 min-h-[36px] tracking-wider">_</div>
                </div>

                <!-- Keypad Grid -->
                <div class="grid grid-cols-3 gap-2 mb-3">
                    <button onclick="pressKey('1')"
                        class="py-3 sm:py-3.5 rounded-xl bg-dark-800 active:bg-orange-500/20 text-lg font-bold font-mono text-slate-100 border border-dark-700 active:border-orange-500 hover:border-slate-500 transition">1</button>
                    <button onclick="pressKey('2')"
                        class="py-3 sm:py-3.5 rounded-xl bg-dark-800 active:bg-orange-500/20 text-lg font-bold font-mono text-slate-100 border border-dark-700 active:border-orange-500 hover:border-slate-500 transition">2</button>
                    <button onclick="pressKey('3')"
                        class="py-3 sm:py-3.5 rounded-xl bg-dark-800 active:bg-orange-500/20 text-lg font-bold font-mono text-slate-100 border border-dark-700 active:border-orange-500 hover:border-slate-500 transition">3</button>
                    <button onclick="pressKey('4')"
                        class="py-3 sm:py-3.5 rounded-xl bg-dark-800 active:bg-orange-500/20 text-lg font-bold font-mono text-slate-100 border border-dark-700 active:border-orange-500 hover:border-slate-500 transition">4</button>
                    <button onclick="pressKey('5')"
                        class="py-3 sm:py-3.5 rounded-xl bg-dark-800 active:bg-orange-500/20 text-lg font-bold font-mono text-slate-100 border border-dark-700 active:border-orange-500 hover:border-slate-500 transition">5</button>
                    <button onclick="pressKey('6')"
                        class="py-3 sm:py-3.5 rounded-xl bg-dark-800 active:bg-orange-500/20 text-lg font-bold font-mono text-slate-100 border border-dark-700 active:border-orange-500 hover:border-slate-500 transition">6</button>
                    <button onclick="pressKey('7')"
                        class="py-3 sm:py-3.5 rounded-xl bg-dark-800 active:bg-orange-500/20 text-lg font-bold font-mono text-slate-100 border border-dark-700 active:border-orange-500 hover:border-slate-500 transition">7</button>
                    <button onclick="pressKey('8')"
                        class="py-3 sm:py-3.5 rounded-xl bg-dark-800 active:bg-orange-500/20 text-lg font-bold font-mono text-slate-100 border border-dark-700 active:border-orange-500 hover:border-slate-500 transition">8</button>
                    <button onclick="pressKey('9')"
                        class="py-3 sm:py-3.5 rounded-xl bg-dark-800 active:bg-orange-500/20 text-lg font-bold font-mono text-slate-100 border border-dark-700 active:border-orange-500 hover:border-slate-500 transition">9</button>
                    <button onclick="pressKey('clear')"
                        class="py-3 sm:py-3.5 rounded-xl bg-red-950/50 text-red-400 font-bold text-xs border border-red-900/50 hover:bg-red-900/40 transition">CLR</button>
                    <button onclick="pressKey('0')"
                        class="py-3 sm:py-3.5 rounded-xl bg-dark-800 active:bg-orange-500/20 text-lg font-bold font-mono text-slate-100 border border-dark-700 active:border-orange-500 hover:border-slate-500 transition">0</button>
                    <button onclick="pressKey('back')"
                        class="py-3 sm:py-3.5 rounded-xl bg-dark-800 active:bg-orange-500/20 text-slate-300 border border-dark-700 flex items-center justify-center hover:border-slate-500 transition"
                        title="Delete digit">
                        <i data-lucide="delete" class="w-5 h-5"></i>
                    </button>
                </div>

                <button onclick="submitKeypad()"
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 text-dark-950 font-bold text-sm tracking-wide shadow-md shadow-orange-500/30 hover:opacity-95 transition active:scale-[0.99]">
                    SHOW TONE
                </button>
            </div>
        </div>

        <!-- Toast Notification for Copy / Favorites -->
        <div id="toast"
            class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-dark-800 text-white text-xs font-semibold px-4 py-2.5 rounded-full border border-dark-600 shadow-xl shadow-black/60 flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300">
            <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400" id="toastIcon"></i>
            <span id="toastMessage">Copied to clipboard</span>
        </div>

    </div>

        // Flatten tones array for fast lookup
        const allTones = [];

            cat.items.forEach(item => {
                allTones.push({
                    no: item[0],
                    name: item[1],
                    lcd: item[2],
                    category: cat.name,
                    categorySub: cat.sub
                });
            });
        });

        // State management
        let selectedCategory = "ALL";
        let searchQuery = "";
        let favoritesOnly = false;
        let favorites = new Set();
        let keypadBuffer = "";

        // Load favorites from localStorage
        try {
            const savedFavs = localStorage.getItem('roland_ex50_favs');
            if (savedFavs) {
                favorites = new Set(JSON.parse(savedFavs));
            }
        } catch (e) {
            console.error(e);
        }

        function saveFavorites() {
            try {
                localStorage.setItem('roland_ex50_favs', JSON.stringify(Array.from(favorites)));
            } catch (e) {
                console.error(e);
            }
            updateFavCountBadge();
        }

        function updateFavCountBadge() {
            // Mobile elements
            const favBadge = document.getElementById('favCount');
            const favBtn = document.getElementById('favoriteFilterBtn');
            const favIcon = document.getElementById('favFilterIcon');

            // Desktop elements
            const favBadgeDesktop = document.getElementById('favCountDesktop');
            const favBtnDesktop = document.getElementById('favoriteFilterBtnDesktop');
            const favIconDesktop = document.getElementById('favFilterIconDesktop');

            const count = favorites.size;

            // Mobile badge
            if (favBadge) {
                favBadge.textContent = count;
                if (count > 0) favBadge.classList.remove('hidden');
                else favBadge.classList.add('hidden');
            }

            // Desktop badge
            if (favBadgeDesktop) {
                favBadgeDesktop.textContent = count;
                if (count > 0) favBadgeDesktop.classList.remove('hidden');
                else favBadgeDesktop.classList.add('hidden');
            }

            // Mobile button state
            if (favBtn) {
                if (favoritesOnly) {
                    favBtn.classList.add('bg-amber-500/20', 'border-amber-400', 'text-amber-400');
                    if (favIcon) favIcon.setAttribute('fill', 'currentColor');
                } else {
                    favBtn.classList.remove('bg-amber-500/20', 'border-amber-400', 'text-amber-400');
                    if (favIcon) favIcon.removeAttribute('fill');
                }
            }

            // Desktop button state
            if (favBtnDesktop) {
                if (favoritesOnly) {
                    favBtnDesktop.classList.add('bg-amber-500/20', 'border-amber-400', 'text-amber-400');
                    if (favIconDesktop) favIconDesktop.setAttribute('fill', 'currentColor');
                } else {
                    favBtnDesktop.classList.remove('bg-amber-500/20', 'border-amber-400', 'text-amber-400');
                    if (favIconDesktop) favIconDesktop.removeAttribute('fill');
                }
            }
        }

        function toggleFavorite(toneNo, event) {
            if (event) event.stopPropagation();
            if (favorites.has(toneNo)) {
                favorites.delete(toneNo);
                showToast(`Tone #${toneNo} removed from favorites`);
            } else {
                favorites.add(toneNo);
                showToast(`Tone #${toneNo} added to favorites`, 'star');
            }
            saveFavorites();
            renderList();
        }

        function toggleFavoritesOnly() {
            favoritesOnly = !favoritesOnly;
            updateFavCountBadge();
            renderList();
        }

        // Render Categories Navigation
        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            let html = `
        <button
          onclick="selectCategory('ALL')"
          class="category-tab tap-highlight-transparent whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5 ${selectedCategory === 'ALL' ? 'bg-gradient-to-r from-orange-500 to-amber-500 text-dark-950 shadow-md font-bold' : 'bg-dark-800 text-slate-300 hover:bg-dark-700 border border-dark-700'}"
        >
          <span>All</span>
          <span class="text-[10px] opacity-75 font-mono">707</span>
        </button>
      `;

            rawCategories.forEach(cat => {
                const isSelected = selectedCategory === cat.name;
                html += `
          <button
            onclick="selectCategory('${cat.name}')"
            class="category-tab tap-highlight-transparent whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium transition-all flex items-center gap-1.5 ${isSelected ? 'bg-gradient-to-r from-orange-500 to-amber-500 text-dark-950 shadow-md font-bold' : 'bg-dark-800 text-slate-300 hover:bg-dark-700 border border-dark-700'}"
          >
            <span>${cat.name}</span>
            <span class="text-[10px] opacity-75 font-mono">(${cat.items.length})</span>
          </button>
        `;
            });

            tabsContainer.innerHTML = html;
        }

        function selectCategory(catName) {
            selectedCategory = catName;
            favoritesOnly = false;
            updateFavCountBadge();
            renderCategoryTabs();
            renderList();
        }

        // Render tone items (Solid, Crisp Modern Cards)
        function renderList() {
            const toneList = document.getElementById('toneList');
            const emptyState = document.getElementById('emptyState');
            const resultsCount = document.getElementById('resultsCount');

            const query = searchQuery.trim().toLowerCase();

            const filtered = allTones.filter(item => {
                // Category filter
                if (selectedCategory !== "ALL" && item.category !== selectedCategory) {
                    return false;
                }

                // Favorites filter
                if (favoritesOnly && !favorites.has(item.no)) {
                    return false;
                }

                // Search text / number filter
                if (query) {
                    const noStr = item.no.toString();
                    const nameStr = item.name.toLowerCase();
                    const lcdStr = item.lcd.toLowerCase();
                    const catStr = item.category.toLowerCase();
                    const catSubStr = item.categorySub.toLowerCase();

                    // Direct match on number or text contains
                    if (
                        noStr === query ||
                        noStr.padStart(3, '0') === query ||
                        noStr.includes(query) ||
                        nameStr.includes(query) ||
                        lcdStr.includes(query) ||
                        catStr.includes(query) ||
                        catSubStr.includes(query)
                    ) {
                        return true;
                    }
                    return false;
                }

                return true;
            });

            // Update count
            resultsCount.innerHTML = `Showing <span class="font-bold text-orange-400">${filtered.length}</span> tone${filtered.length === 1 ? '' : 's'} ${favoritesOnly ? '(Favorites)' : ''}`;

            if (filtered.length === 0) {
                toneList.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            let html = '';
            filtered.forEach(tone => {
                const isFav = favorites.has(tone.no);
                const formattedNo = String(tone.no).padStart(3, '0');

                html += `
          <div
            onclick="copyTone(${tone.no}, '${tone.name.replace(/'/g, "\\'")}', '${tone.lcd}')"
            class="group relative p-3 rounded-xl border border-dark-700 hover:border-orange-500/60 bg-dark-850 transition-all active:scale-[0.99] flex items-center justify-between gap-3 cursor-pointer shadow-sm hover:shadow-md"
          >
            <!-- Left: Number Badge & Name Details -->
            <div class="flex items-center gap-3 min-w-0 flex-1">
              <div class="flex-shrink-0 w-11 h-11 sm:w-12 sm:h-12 rounded-lg bg-dark-900 border border-dark-700 flex flex-col items-center justify-center font-mono group-hover:border-orange-500/50 group-hover:bg-dark-800 transition-colors">
                <span class="text-[9px] text-slate-400 font-medium tracking-tighter leading-none">NO.</span>
                <span class="text-sm sm:text-base font-extrabold text-orange-400 leading-tight">${formattedNo}</span>
              </div>
              
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5">
                  <h2 class="text-sm sm:text-[14.5px] font-bold text-slate-100 truncate group-hover:text-orange-300 transition-colors">
                    ${highlightMatch(tone.name, query)}
                  </h2>
                </div>
                <div class="flex items-center gap-2 mt-0.5 text-xs text-slate-400 flex-wrap">
                  <span class="inline-flex items-center px-1.5 py-0.2 rounded bg-dark-900 border border-dark-700 text-[10.5px] sm:text-[11px] font-mono text-emerald-400 font-semibold tracking-tight">
                    ${highlightMatch(tone.lcd, query)}
                  </span>
                  <span class="text-[11px] text-slate-400 truncate">${tone.categorySub}</span>
                </div>
              </div>
            </div>

            <!-- Right: Action Buttons -->
            <div class="flex items-center gap-1.5 flex-shrink-0">
              <button
                onclick="toggleFavorite(${tone.no}, event)"
                class="tap-highlight-transparent p-2 rounded-lg text-slate-400 hover:text-amber-400 hover:bg-dark-800 transition"
                title="Favorite"
              >
                <i data-lucide="star" class="w-4 h-4 ${isFav ? 'text-amber-400 fill-amber-400' : ''}"></i>
              </button>
              
              <div class="p-2 rounded-lg text-slate-400 group-hover:text-slate-200 group-hover:bg-dark-800 transition" title="Copy Tone">
                <i data-lucide="copy" class="w-4 h-4"></i>
              </div>
            </div>
          </div>
        `;
            });

            toneList.innerHTML = html;
            lucide.createIcons();
        }

        // Helper text highlight
        function highlightMatch(text, query) {
            if (!query || query.length < 2) return text;
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="bg-orange-500/25 text-orange-300 font-bold px-0.5 rounded">$1</span>');
        }

        // Copy Tone Helper
        function copyTone(no, name, lcd) {
            const textToCopy = `${String(no).padStart(3, '0')} - ${name} [${lcd}]`;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy);
            } else {
                const temp = document.createElement('input');
                temp.value = textToCopy;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
            }
            showToast(`Tone #${no} (${name}) copied!`, 'clipboard-check');
        }

        // Toast Functionality
        let toastTimeout;
        function showToast(message, iconName = 'check') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;
            toastIcon.setAttribute('data-lucide', iconName);
            lucide.createIcons();

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
                toast.classList.remove('opacity-100');
            }, 2200);
        }

        // Search Input Handling
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            if (searchQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderList();
        });

        function clearSearch() {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderList();
            searchInput.focus();
        }

        function resetFilters() {
            clearSearch();
            selectedCategory = 'ALL';
            favoritesOnly = false;
            renderCategoryTabs();
            updateFavCountBadge();
            renderList();
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Keypad Modal Logic
        function openKeypadModal() {
            keypadBuffer = "";
            updateKeypadDisplay();
            const modal = document.getElementById('keypadModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeKeypadModal() {
            const modal = document.getElementById('keypadModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function pressKey(key) {
            if (key === 'clear') {
                keypadBuffer = "";
            } else if (key === 'back') {
                keypadBuffer = keypadBuffer.slice(0, -1);
            } else {
                if (keypadBuffer.length < 3) {
                    keypadBuffer += key;
                    // Cap at 707
                    if (parseInt(keypadBuffer, 10) > 707) {
                        keypadBuffer = "707";
                    }
                }
            }
            updateKeypadDisplay();
        }

        function updateKeypadDisplay() {
            const display = document.getElementById('keypadDisplay');
            display.textContent = keypadBuffer ? keypadBuffer : '_';
        }

        function submitKeypad() {
            if (keypadBuffer) {
                selectedCategory = "ALL";
                favoritesOnly = false;
                renderCategoryTabs();
                updateFavCountBadge();

                searchInput.value = keypadBuffer;
                searchQuery = keypadBuffer;
                clearSearchBtn.classList.remove('hidden');

                closeKeypadModal();
                renderList();
                scrollToTop();
            } else {
                closeKeypadModal();
            }
        }

        // Close modal on outer click
        document.getElementById('keypadModal').addEventListener('click', (e) => {
            if (e.target.id === 'keypadModal') {
                closeKeypadModal();
            }
        });

        // Global Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('keypadModal');
            const isModalOpen = !modal.classList.contains('hidden');

            if (isModalOpen) {
                if (e.key >= '0' && e.key <= '9') {
                    e.preventDefault();
                    pressKey(e.key);
                } else if (e.key === 'Backspace') {
                    e.preventDefault();
                    pressKey('back');
                } else if (e.key === 'Delete' || e.key === 'c' || e.key === 'C') {
                    e.preventDefault();
                    pressKey('clear');
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    submitKeypad();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeKeypadModal();
                }
                return;
            }

            // If user is currently typing in search input
            if (document.activeElement === searchInput) {
                if (e.key === 'Escape') {
                    searchInput.blur();
                    if (searchQuery) clearSearch();
                }
                return;
            }

            // Quick open search with "/"
            if (e.key === '/') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            } else if (e.key === 'k' || e.key === 'K') {
                e.preventDefault();
                openKeypadModal();
            } else if (e.key === 'Escape') {
                if (searchQuery) {
                    clearSearch();
                }
            }
        });

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryTabs();
            updateFavCountBadge();
            renderList();
            lucide.createIcons();
        });
